# config/comparisons.yaml
# Curated registry of the experimental comparisons this sample set admits.
# Group predicates filter results/data_model/samples.tsv; the builder resolves realized n,
# model rank, residual df, and inference-capability from the resolved sample subset.
# Pre-registered: tier + hypotheses are frozen (git-HEAD freeze check, like pathway sets).

comparisons:
  # ---- sample-level, day-2 inference cohort (n=2/arm after relabel) ----
  - name: SBRT_vs_Ctrl
    kind: sample
    resolution: [whole, compartment]
    cohort: mutter02_day2
    group1: {treatment: SBRT, timepoint_h: 48, model: flank}
    group2: {treatment: NT,   timepoint_h: 48, model: flank}
    unit: mouse
    formula: "~0 + condition + slide_id"
    contrast_levels: {num: SBRT_day2, den: Control}   # engine builds condition<num> - condition<den>
    transform: logit                                   # proportion-readout default; continuous rules override to identity
    tier: confirmatory
    hypotheses: [H1_immune, H2_vascular, H3_stromal]
    dose_confounded: false

  - name: MBRT_vs_Ctrl
    kind: sample
    resolution: [whole, compartment]
    cohort: mutter02_day2
    group1: {treatment: MBRT, timepoint_h: 48, model: flank}
    group2: {treatment: NT,   timepoint_h: 48, model: flank}
    unit: mouse
    formula: "~0 + condition + slide_id"
    contrast_levels: {num: MBRT_day2, den: Control}
    transform: logit
    tier: confirmatory
    hypotheses: [H1_immune, H2_vascular, H3_stromal]
    dose_confounded: false
    notes: >
      Whole-compartment averaging cancels a peak-restricted MBRT signal (dilution).
      Bounds, does not resolve, the MBRT question -- see region MBRT_peak_vs_valley.

  - name: MBRT_vs_SBRT
    kind: sample
    resolution: [whole, compartment]
    cohort: mutter02_day2
    group1: {treatment: MBRT, timepoint_h: 48, model: flank}
    group2: {treatment: SBRT, timepoint_h: 48, model: flank}
    unit: mouse
    formula: "~0 + condition + slide_id"
    contrast_levels: {num: MBRT_day2, den: SBRT_day2}
    transform: logit
    tier: confirmatory
    hypotheses: [H1_immune, H2_vascular, H3_stromal]
    dose_confounded: true
    view:
      differential_response_scatter: true

  # ---- sample-level, 4h arm contrasts (M01+M02 combined) ----
  - name: MBRT_vs_SBRT_4h
    kind: sample
    resolution: [whole, compartment]
    cohort: combined_4h_treated
    group1: {treatment: MBRT, timepoint_h: 4, model: flank}
    group2: {treatment: SBRT, timepoint_h: 4, model: flank}
    unit: mouse
    formula: "~0 + condition"
    contrast_levels: {num: MBRT_4h, den: SBRT_4h}
    transform: logit
    tier: exploratory
    dose_confounded: true
    notes: >
      Combined M01+M02 cohort (n=3 MBRT, n=3 SBRT). Own 2-condition cohort
      without controls so the DESeq2 sample-count floor does not block the contrast.
      No slide_id covariate: each slide contributes exactly one section per arm.

  - name: MBRT_vs_Ctrl_4h
    kind: sample
    resolution: [whole, compartment]
    cohort: combined_4h
    group1: {treatment: MBRT, timepoint_h: 4, model: flank}
    group2: {treatment: NT,   timepoint_h: 4, model: flank}
    unit: mouse
    formula: "~0 + condition"
    contrast_levels: {num: MBRT_4h, den: Control}
    transform: logit
    tier: exploratory
    min_samples: 2
    notes: >
      Control n=2 (M02 only, M01 has no 4h control). Treat as independent
      pending Fazzari mouse-to-block confirmation. Low-powered.

  - name: SBRT_vs_Ctrl_4h
    kind: sample
    resolution: [whole, compartment]
    cohort: combined_4h
    group1: {treatment: SBRT, timepoint_h: 4, model: flank}
    group2: {treatment: NT,   timepoint_h: 4, model: flank}
    unit: mouse
    formula: "~0 + condition"
    contrast_levels: {num: SBRT_4h, den: Control}
    transform: logit
    tier: exploratory
    min_samples: 2
    notes: >
      Control n=2 (M02 only). Same caveat as MBRT_vs_Ctrl_4h.

  # ---- sample-level, pooled-control sensitivity arm (all 4 M02 controls pooled
  # across harvest times; vs-Control only, no MBRT_vs_SBRT variant since that
  # contrast has no controls) ----
  - name: MBRT_vs_Ctrl_d2pooled
    kind: sample
    resolution: [whole, compartment]
    cohort: mutter02_day2_pooledctrl
    group1: {treatment: MBRT, model: flank}
    group2: {treatment: NT,   model: flank}
    unit: mouse
    formula: "~0 + condition"
    contrast_levels: {num: MBRT_day2, den: Control}
    transform: logit
    tier: exploratory
    notes: >
      Control-pooling sensitivity arm: pools all 4 M02 control samples (2 day-2 +
      2 4h-slide) against the day-2 MBRT arm (n=2). No slide_id term -- the added
      4h-slide controls are unpaired, so a slide covariate would be estimable only
      from single-control samples and would consume exactly the df pooling adds.

  - name: SBRT_vs_Ctrl_d2pooled
    kind: sample
    resolution: [whole, compartment]
    cohort: mutter02_day2_pooledctrl
    group1: {treatment: SBRT, model: flank}
    group2: {treatment: NT,   model: flank}
    unit: mouse
    formula: "~0 + condition"
    contrast_levels: {num: SBRT_day2, den: Control}
    transform: logit
    tier: exploratory
    notes: >
      Control-pooling sensitivity arm: pools all 4 M02 control samples (2 day-2 +
      2 4h-slide) against the day-2 SBRT arm (n=2). No slide_id term -- see
      MBRT_vs_Ctrl_d2pooled.

  - name: MBRT_vs_Ctrl_4h_pooled
    kind: sample
    resolution: [whole, compartment]
    cohort: combined_4h_pooledctrl
    group1: {treatment: MBRT, model: flank}
    group2: {treatment: NT,   model: flank}
    unit: mouse
    formula: "~0 + condition"
    contrast_levels: {num: MBRT_4h, den: Control}
    transform: logit
    tier: exploratory
    notes: >
      Control-pooling sensitivity arm: pools all 4 M02 control samples (2 4h-slide +
      2 day-2) against the combined M01+M02 4h MBRT arm (n=3). No slide_id term --
      the added day-2-slide controls are unpaired.

  - name: SBRT_vs_Ctrl_4h_pooled
    kind: sample
    resolution: [whole, compartment]
    cohort: combined_4h_pooledctrl
    group1: {treatment: SBRT, model: flank}
    group2: {treatment: NT,   model: flank}
    unit: mouse
    formula: "~0 + condition"
    contrast_levels: {num: SBRT_4h, den: Control}
    transform: logit
    tier: exploratory
    notes: >
      Control-pooling sensitivity arm: pools all 4 M02 control samples (2 4h-slide +
      2 day-2) against the combined M01+M02 4h SBRT arm (n=3). No slide_id term --
      see MBRT_vs_Ctrl_4h_pooled.

  # ---- region-level, within-sample ----
  - name: MBRT_peak_vs_valley
    kind: region
    axis: dist_to_peak
    test: periodicity_rotation_null
    cohorts: [mutter01_mbrt_4h, mutter02_4h]
    unit: mouse
    pairing: within_mouse
    requires: h2ax_registration
    tier: confirmatory
    method_notes: [fov_alias_guard, dose_dropout_check, boundary_buffer, nonlinear_distance]

  - name: MBRT_valley_vs_SBRT
    kind: region
    cohorts: [mutter02_4h]
    unit: mouse
    requires: h2ax_registration
    tier: exploratory
    dose_confounded: true

  - name: niche_DA_by_arm
    kind: region
    test: kmeans_knn_composition
    cohort: mutter02_day2
    unit: mouse
    formula: "~0 + condition + slide_id"
    tier: exploratory

  - name: tumor_immune_mixing_by_arm
    kind: region
    test: keren_mixing_score
    cohort: mutter02_day2
    unit: mouse
    formula: "~0 + condition + slide_id"
    tier: exploratory

  - name: substate_composition_by_arm
    kind: region
    test: substate_fraction
    cohort: mutter02_day2
    unit: mouse
    formula: "~0 + condition + slide_id"
    tier: exploratory

  # ---- descriptive, time-course cohort (n=1, effect sizes only) ----
  - name: treated_vs_baseline_timecourse
    kind: sample
    cohort: mutter01_flank
    group1: {treatment: [MBRT, SBRT], model: flank}
    group2: {treatment: NT, timepoint_h: 0, model: flank}
    unit: sample
    tier: descriptive
    notes: single 0h control conflates time-since-implant with treatment; descriptive only.

  - name: MBRT_vs_SBRT_matched_timepoint
    kind: sample
    cohort: mutter01_flank
    strata: [4, 48, 144]
    unit: sample
    tier: descriptive

  - name: MBRT_vs_SBRT_tongue_day10
    kind: sample
    cohort: mutter01_tongue
    unit: sample
    tier: descriptive
    notes: different tumor + site; timepoint-confounded cross-model context only.

  # ---- context / replication ----
  - name: cohort_concordance
    kind: context
    test: effect_size_concordance
    tier: exploratory
    notes: M01 n=1 anti-correlates with M02 on the SBRT signal; contextual, cannot corroborate.
