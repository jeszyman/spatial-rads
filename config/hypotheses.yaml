# Frozen pre-registered confirmatory hypotheses. One entry per hypothesis.
# Each program's `genes` list is BOTH the GSEA enrichment set AND, if that gate
# opens, the gene-level FDR universe. Freeze: frozen_at git-SHA per entry.
#
# Pathway gene lists are the on-panel primary sets from
# results/data_model/pathway_sets.tsv (set==<program>, tier==primary,
# on_panel==TRUE). M1/M2 marker lists are copied from
# scripts/aggregate/myeloid_polarization.R:21-24 (intersect with panel at load).
hypotheses:
  - name: immune_activation
    cell_types: [T cells, NK cells, ILC, Plasma cells, Macrophages, DC, Mast cells, Neutrophils]
    contrasts: [SBRT_vs_Ctrl, MBRT_vs_Ctrl, MBRT_vs_SBRT]
    programs:
      - {name: TypeI_interferon, genes: [Bst2, Ifi27, Ifit1, Ifit3/b, Ifitm1, Ifitm3, Ifna, Ifnar1, Irf3, Irf4, Jak1, Mx1, Oas1a/g, Oas2, Oas3, Oasl1, Rigi, Tyk2]}
      - {name: TypeII_interferon, genes: [B2m, Cd44, Ciita, Icam1, Ifng, Ifngr1, Ifngr2, Irf3, Irf4, Jak1, Jak2, Oas1a/g, Oas2, Oas3, Oasl1, Vcam1]}
    provenance: {source: [kanagavelu2014], frozen_at: 2b8c190}

  - name: vascular_hypoxia
    cell_types: [Endothelial, Tumor]
    contrasts: [SBRT_vs_Ctrl, MBRT_vs_Ctrl, MBRT_vs_SBRT]
    programs:
      - {name: Angiogenesis, genes: [Col4a1, Col4a2, Rgcc, Vwa1, Vwf, Akt1, Axl, Calm1, Cav1, Cdh5, Ctnnb1, Fyn, Hsp90aa1, Hspb1, Itgav, Kdr, Kras, Mapk13, Mapk14, Mtor, Pgf, Ptgs2, Ptk2, Rac1, Rac2, Src, Vegfa, Vegfb, Vegfc, Vegfd]}
