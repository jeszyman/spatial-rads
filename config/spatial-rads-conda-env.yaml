name: spatial-rads
channels:
  - conda-forge
  - bioconda

dependencies:
  # --- R core ---
  - r-base>=4.4
  - r-irkernel
  # --- Seurat & spatial ---
  - r-seurat>=5.0
  - r-seuratobject
  # --- Tidyverse & data ---
  - r-tidyverse
  - r-data.table
  - r-arrow
  - r-readxl
  # --- Visualization ---
  - r-ggplot2
  - r-patchwork
  - bioconductor-complexheatmap
  # --- Spatial analysis ---
  - r-rann
  - r-ape            # Moran.I() for spatial autocorrelation
  # --- Signature scoring ---
  - bioconductor-ucell  # rank-based signature scoring (primary)
  # --- Integration (aggregate.smk) ---
  - r-harmony           # batch integration of cell-type + Banksy PCs
  # NOTE: LISI (immunogenomics/lisi) is not on conda; the LISI(dataset) gate
  # in embed_celltype.R is computed manually (local inverse Simpson on the
  # Harmony kNN graph) -- see scripts/aggregate/embed_celltype.R.
  # --- Spatial niche (aggregate.smk) ---
  - bioconductor-banksy            # spatial niche embedding
  - r-mclust               # model-based niche clustering (BIC K selection)
  - bioconductor-spatialexperiment # SPE container for Banksy
  # --- Composition / DE / pathway inference (aggregate.smk) ---
  - bioconductor-speckle  # propeller composition test
  - bioconductor-deseq2   # pseudobulk DE
  - bioconductor-apeglm   # lfcShrink for DESeq2
  - bioconductor-fgsea    # pathway GSEA on ranked stats
  - bioconductor-limma    # pathway-score inference on per-sample means
  - bioconductor-ihw      # covariate-weighted FDR (detection-rate-keyed auxiliary padj)
  - r-msigdbr=26.1.0      # MSigDB Hallmark gene sets (exploratory tier); pinned for reproducibility
  # --- Spatial colocalization (aggregate.smk) ---
  - bioconductor-spicyr   # cell-cell colocalization inference
  # --- Signal processing ---
  - r-zoo
  # --- PPTX/image handling (H2AX validation) ---
  - r-officer
  - r-magick
  # --- Parallel ---
  - r-future
  # --- Segmentation-contamination QC + per-cell DE (overlap_ratio_qc.R, smide_de.R) ---
  # smiDE itself is GitHub-only (Nanostring-Biostats/CosMx-Analysis-Scratch-Space,
  # subdir _code/smiDE) -- not installable via conda, so it is NOT listed here;
  # install with remotes::install_github(..., ref = "Main"). r-sf/r-spdep are its
  # compiled geospatial dependencies, which fail building from CRAN source (missing
  # GDAL/GEOS/PROJ headers) unless pulled as prebuilt conda-forge binaries first.
  - r-sf
  - r-spdep
  # smiDE turns every fit into contrasts through emmeans::qdrg(), passing the model
  # offset as a scalar named `offsetuse`. emmeans 2.0.4 tries to resolve that name as
  # a data variable, so ref_grid() fails with "We are unable to reconstruct the data"
  # and every GP_Matern (spaMM) fit in smide_de.R's spatial mode dies. 1.10.7 is
  # verified working. Pinned below 2.0 until smiDE updates its qdrg() call. NOTE:
  # conda-forge ships r-emmeans 1.10.7 only against r-base 4.3/4.4, so this pin also
  # holds r-base at 4.4.
  # smiDE's other model backends (spaMM for the Matern spatial random effect,
  # nebula for the NB GLMM) are not packaged on conda-forge; they arrive from CRAN
  # with the remotes::install_github(smiDE) step.
  - r-emmeans<2.0
